<title>U1: předpokládané nožičky 30 a 31</title>
<image x="0" y="0" width="4096" height="2304" xlink:href="../../assets/images/f-tr062w-panel-pcb.jpg"/>
<rect x="2155" y="590" width="640" height="106" rx="10" fill="#fff" fill-opacity=".94"/>
<text x="2170" y="617" font-family="Arial" font-size="18" font-weight="bold" fill="#9a2300">PRACOVNÍ OZNAČENÍ – ověřit skutečnou značku pinu 1</text>
<text x="2170" y="643" font-family="Arial" font-size="16" fill="#111">Platí, pokud bílý bod vlevo dole u U1 označuje pin 1.</text>
<text x="2170" y="668" font-family="Arial" font-size="16" fill="#111">USART1 je pouze možná funkce, nikoli potvrzené TX/RX panelu.</text>
