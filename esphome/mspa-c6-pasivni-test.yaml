# Pasivní první test pro MuseLab nanoESP32-C6.
# Pouze RX: neobsahuje tx_pin, ovládací příkazy ani komponentu mspa_uart.
# Původní panel zůstává přímo připojený k řídicí jednotce.
# 9600 8N1: na zelené lince již zachyceny platné stavové rámce.

esphome:
  name: mspa-c6-test
  friendly_name: MSpa C6 pasivní test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # Na této desce odpovídá nativnímu USB-C vpravo (ESP32C6).
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret wifi_password_iot

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid_iot
      password: !secret wifi_password_iot
    - ssid: !secret wifi_ssid_dilna
      password: !secret wifi_password_dilna
    - ssid: !secret wifi_ssid_pracovna
      password: !secret wifi_password_pracovna
    - ssid: !secret wifi_ssid_tominet
      password: !secret wifi_password_tominet
  reboot_timeout: 0s
  ap:
    ssid: mspa-c6-test-hotspot
    password: !secret wifi_password_iot

captive_portal:

web_server:
  port: 80
  auth:
    username: tom
    password: !secret wifi_password_n3

uart:
  id: odposlech
  rx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 100ms
      bytes: 32
